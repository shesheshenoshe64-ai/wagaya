    if(P&&P.mode==='drag'){const y=P.cy,d=y>L.H-100?10:y<L.top+L.hh+60?-10:0;if(d){const n=clamp(scrollY+d,0,maxS());if(n!==scrollY){scrollY=n;retarget(false)}}}
    cards.forEach(o=>{const g=o.g;g.rotation.x*=.85;g.rotation.y*=.85;g.rotation.z*=.85;if(o.hold||(P&&P.mode==='drag'&&P.o===o))return;g.position.x+=(o.tx-g.position.x)*.25;g.position.y+=(o.ty-g.position.y)*.25;g.position.z*=.75});
    R.render(S,cam)}
  const ro=new ResizeObserver(()=>build());ro.observe(root);build();frame();
  return{sync,retex:()=>{ver++;sync()},destroy:()=>{cancelAnimationFrame(raf);ro.disconnect();cards.forEach(kill);R.dispose();R.forceContextLoss()}}
}

function TaskTab({ tasks, setTasks, members }) {
  const rootRef=useRef(null),cvRef=useRef(null),api=useRef(null);
  const [fil,setFil]=useState('all');
  const [sh,setSh]=useState(null);
  const st=useRef({});
  const openSheet=t=>setSh({id:t?t.id:null,t:t?t.t:'',m:t?t.m:(st.current.fil!=='all'?st.current.fil:(members[0]?.id??'')),p:t?t.p:1,c:t?t.c:'todo',arm:false});
  st.current={tasks,members,fil,setTasks,open:openSheet};
  useEffect(()=>{const a=createBoard(cvRef.current,rootRef.current,st);api.current=a;
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>api.current&&api.current.retex());
    return()=>{a.destroy();api.current=null}},[]);
  useEffect(()=>{api.current&&api.current.sync()},[tasks,members,fil]);
  const upd=k=>v=>setSh(p=>({...p,[k]:v,arm:false}));
  const save=()=>{const title=clean(sh.t,60);if(!title)return;
    if(sh.id){setTasks(p=>{const old=p.find(x=>x.id===sh.id);if(!old)return p;const nt={...old,t:title,m:sh.m,p:sh.p,c:sh.c};return old.c!==sh.c?[...p.filter(x=>x.id!==sh.id),nt]:p.map(x=>x.id===sh.id?nt:x)})}
    else if(tasks.length<LIM.items)setTasks(p=>[...p,{id:uid(),t:title,m:sh.m,p:sh.p,c:'todo',ts:Date.now()}]);
    setSh(null)};
  const del=()=>{if(!sh.arm){setSh(p=>({...p,arm:true}));return}setTasks(p=>p.filter(x=>x.id!==sh.id));setSh(null)};
  const sc=(on,c)=>({borderColor:on?c:'#E5E5E5',background:on?c+'1A':'#fff',color:on?c:'#666'});
  return h('div',{ref:rootRef,style:{position:'absolute',inset:0,overflow:'hidden',background:'#F4F1EE'}},
    h('canvas',{ref:cvRef,style:{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',touchAction:'none'}}),
    h('div',{className:'tk-chips'},
      [{id:'all',name:'すべて',emoji:'🗂',color:'#333'},...members].map(m=>h('button',{key:m.id,className:'chip',style:sc(fil===m.id,m.color),onClick:()=>setFil(m.id)},(m.emoji?m.emoji+' ':'')+m.name))),
    tasks.length===0&&h('div',{className:'tk-empty'},'タスクはまだありません\n右下の「＋ タスク追加」から始めましょう'),
    h('button',{className:'tk-fab',onClick:()=>openSheet(null)},'＋ タスク追加'),
    sh&&h('div',{className:'tk-back',onClick:()=>setSh(null)},
      h('div',{className:'tk-sheet',onClick:e=>e.stopPropagation()},
        h('div',{style:{fontSize:17,fontWeight:800,marginBottom:12}},sh.id?'タスクを編集':'タスクを追加'),
        h('input',{className:'field',style:{margin:0,fontSize:16},autoFocus:!sh.id,placeholder:'例：夕食の買い物',maxLength:60,value:sh.t,onChange:e=>upd('t')(e.target.value),onKeyDown:e=>e.key==='Enter'&&save()}),
        h('div',{className:'tk-lb'},'👤 担当'),
        h('div',{className:'tk-row'},members.map(m=>h('button',{key:m.id,className:'m-chip',style:sc(sh.m===m.id,m.color),onClick:()=>upd('m')(m.id)},m.emoji+' '+m.name))),
        h('div',{className:'tk-lb'},'優先度'),
        h('div',{className:'tk-row'},TK_PRI.map((n,i)=>h('button',{key:n,className:'m-chip',style:sc(sh.p===i,'#FF5E8A'),onClick:()=>upd('p')(i)},n))),
        sh.id&&h(Fragment,null,h('div',{className:'tk-lb'},'状態'),
          h('div',{className:'tk-row'},TK_COL.map(c=>h('button',{key:c.id,className:'m-chip',style:sc(sh.c===c.id,c.c),onClick:()=>upd('c')(c.id)},c.n)))),
        h('div',{className:'tk-act'},
          sh.id&&h('button',{className:'tk-del',onClick:del},sh.arm?'もう一度タップで削除':'削除'),
          h('button',{className:'btn btn-grad',style:{flex:2},onClick:save},'保存'))))
  );
}

// ═══════════════════════ SETTINGS ════════════════════════════════════════════
function CfgTab({ members, setMembers, onReset }) {
  const [showAdd, setShowAdd] = useState(false);
  const [newName, setNewName] = useState('');
  const [newEmoji,setNewEmoji]= useState(EMOJIS[0]);
  const [newClr,  setNewClr]  = useState(PAL[0]);
  const addM = () => {
    const name=clean(newName,20);
    if(!name||members.length>=LIM.members)return;
    setMembers(p=>[...p,{id:uid(),name,emoji:newEmoji,color:cleanClr(newClr)}]);
    setNewName('');setShowAdd(false);
  };
  const delM = id => { if(members.length<=1)return; setMembers(p=>p.filter(m=>m.id!==id)); };

  return h(Fragment, null,
    h('div',{className:'box box-green'},
      h('strong',null,'🟢 リアルタイム同期中'),
      'Firebaseで全員のデータが自動同期されます。同じURLを開くだけで家族全員が最新データを見られます。'
    ),
    h('div',{className:'card'},
      h('div',{className:'card-label'},'家族メンバー'),
      members.map(m=>h('div',{key:m.id,className:'m-row'},
        h('span',{style:{fontSize:24}},m.emoji),
        h('div',{style:{flex:1}},h('div',{style:{fontSize:15,fontWeight:700}},m.name)),
        h('div',{style:{width:13,height:13,borderRadius:'50%',background:m.color}}),
        h('button',{className:'del',disabled:members.length<=1,style:{opacity:members.length<=1?.22:1},onClick:()=>delM(m.id)},'✕'),
      )),
      members.length<LIM.members&&h(Fragment,null,
        h('button',{className:'btn btn-ghost'+(showAdd?' warn':''),style:{marginTop:12,width:'100%'},onClick:()=>setShowAdd(p=>!p)},showAdd?'✕ 閉じる':'＋ メンバーを追加'),
        showAdd&&h('div',{className:'fi',style:{marginTop:12}},
          h('input',{className:'field',placeholder:'名前（例: じいじ、ばあば）',maxLength:20,value:newName,onChange:e=>setNewName(e.target.value)}),
          h('div',{style:{fontSize:10,fontWeight:800,color:'#AAA',letterSpacing:'.8px',marginBottom:6}},'絵文字'),
          h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}},EMOJIS.map(e=>h('button',{key:e,style:{fontSize:24,padding:'4px 6px',borderRadius:10,border:'2px solid',borderColor:newEmoji===e?'#FF5E8A':'#E5E5E5',background:newEmoji===e?'#FFF0F5':'#fff'},onClick:()=>setNewEmoji(e)},e))),
          h('div',{style:{fontSize:10,fontWeight:800,color:'#AAA',letterSpacing:'.8px',marginBottom:6}},'カラー'),
          h('div',{className:'palette'},PAL.slice(0,12).map(c=>h('button',{key:c,className:'pal-dot'+(newClr===c?' on':''),style:{background:c},onClick:()=>setNewClr(c)}))),
          h('button',{className:'btn btn-grad',style:{background:newName.trim()?undefined:'#DDD',boxShadow:'none',color:newName.trim()?'#fff':'#AAA'},disabled:!newName.trim(),onClick:addM},'メンバーを追加'),
        ),
      ),
    ),
    h('div',{className:'card'},
      h('div',{className:'card-label'},'Firebase設定'),
      h('p',{style:{fontSize:13,color:'#888',marginBottom:12,lineHeight:1.7}},'Firebase設定をリセットして再設定画面に戻ります。データはFirebase上に残ります。'),
      h('button',{className:'btn btn-ghost warn',style:{width:'100%'},onClick:()=>{if(!confirm('Firebase設定をリセットしますか？'))return;onReset()}},'🔧 Firebase設定をやり直す'),
    ),
  );
}

createRoot(document.getElementById('root')).render(h(App, null));
</script>
</body>
