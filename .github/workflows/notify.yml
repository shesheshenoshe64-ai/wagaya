name: LINE Daily Notify

on:
  schedule:
    - cron: '45 20 * * *'  # UTC 20:45 = JST 5:45にキュー投入
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
