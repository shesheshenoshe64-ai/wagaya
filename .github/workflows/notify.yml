          CORNER_KEYS = [["frozen", ["冷凍"]], ["house", ["洗剤", "ティッシュ", "トイレットペーパー", "キッチンペーパー", "ラップ", "アルミホイル", "ゴミ袋", "ごみ袋", "シャンプー", "リンス", "ボディソープ", "歯磨き", "ハンドソープ", "スポンジ", "電池", "除菌", "ウェット", "おむつ", "オムツ", "マスク", "漂白", "柔軟剤", "クイックル", "フローリング", "掃除", "石鹸", "せっけん"]], ["drink", ["ビール", "ワイン", "日本酒", "焼酎", "ウイスキー", "ジュース", "お茶", "麦茶", "緑茶", "コーヒー", "紅茶", "炭酸", "サイダー", "コーラ", "チューハイ", "スポーツドリンク", "カルピス", "甘酒", "エナジー", "ミネラルウォーター", "天然水"]], ["dry", ["缶", "スープの素", "コンソメ", "鶏がら", "ルー"]], ["fish", ["魚", "鮭", "さば", "サバ", "あじ", "アジ", "いわし", "イワシ", "さんま", "サンマ", "たら", "タラ", "ぶり", "ブリ", "まぐろ", "マグロ", "かつお", "カツオ", "えび", "エビ", "いか", "イカ", "たこ", "タコ", "あさり", "しじみ", "かき", "カキ", "ほたて", "ホタテ", "かに", "カニ", "しらす", "刺身", "切り身", "切身", "ホッケ", "明太子", "たらこ", "いくら", "うなぎ", "サーモン", "さわら", "サワラ", "きんめ", "キンメ", "めばる", "メバル", "あなご", "アナゴ"]], ["meat", ["肉", "豚", "牛", "鶏", "ひき", "ハム", "ウインナー", "ソーセージ", "ベーコン", "ラム", "ホルモン", "レバー", "手羽", "ささみ", "砂肝", "チャーシュー", "ミンチ", "ステーキ", "しゃぶしゃぶ用"]], ["dairy", ["牛乳", "ミルク", "卵", "たまご", "玉子", "チーズ", "ヨーグルト", "バター", "クリーム", "豆乳", "マーガリン"]], ["daily", ["豆腐", "納豆", "油揚げ", "厚揚げ", "こんにゃく", "しらたき", "かまぼこ", "ちくわ", "さつま揚げ", "はんぺん", "キムチ", "漬物", "メンマ", "めんま", "餃子の皮", "春巻きの皮", "ワンタンの皮", "餃子", "シュウマイ", "中華麺", "焼きそば麺", "ラーメン麺", "うどん玉", "餅", "トッポギ", "梅干し", "紅しょうが", "らっきょう", "福神漬", "プリン", "ゼリー"]], ["veg", ["野菜", "キャベツ", "白菜", "レタス", "玉ねぎ", "ねぎ", "長ねぎ", "にんじん", "じゃがいも", "大根", "きゅうり", "トマト", "なす", "ピーマン", "パプリカ", "ほうれん草", "小松菜", "春菊", "ニラ", "もやし", "ごぼう", "れんこん", "里芋", "さつまいも", "かぼちゃ", "ブロッコリー", "カリフラワー", "セロリ", "アスパラ", "オクラ", "いんげん", "枝豆", "とうもろこし", "しいたけ", "しめじ", "えのき", "まいたけ", "エリンギ", "なめこ", "きのこ", "しょうが", "生姜", "にんにく", "大葉", "しそ", "バジル", "パクチー", "みょうが", "レモン", "りんご", "バナナ", "みかん", "ぶどう", "いちご", "もも", "なし", "梨", "すいか", "メロン", "キウイ", "アボカド", "果物", "フルーツ", "長芋", "山芋", "チンゲン菜", "水菜", "豆苗", "かいわれ", "三つ葉", "パセリ", "サンチュ", "唐辛子", "とうがらし"]], ["dry", ["醤油", "しょうゆ", "味噌", "みそ", "塩", "砂糖", "酢", "料理酒", "みりん", "油", "ソース", "ケチャップ", "マヨネーズ", "ドレッシング", "だし", "つゆ", "めんつゆ", "ポン酢", "小麦粉", "片栗粉", "パン粉", "米", "パスタ", "スパゲッティ", "マカロニ", "そうめん", "そば", "春雨", "海苔", "のり", "わかめ", "ひじき", "切り干し", "ごま", "ナッツ", "カレー", "シチュー", "鍋つゆ", "鍋の素", "焼肉のたれ", "たれ", "タレ", "スパイス", "こしょう", "胡椒", "七味", "わさび", "からし", "ラー油", "豆板醤", "オイスター", "ナンプラー", "ジャム", "はちみつ", "蜂蜜", "シリアル", "グラノーラ", "ふりかけ", "インスタント", "カップ麺", "カップラーメン", "高野豆腐", "粉"]], ["bread", ["パン", "食パン", "バゲット", "クロワッサン", "サンドイッチ"]]]
          CORNER_LABEL = {c['k']: c['label'] for c in CORNERS}

          def base_of(text):
              parts = re.split(r'[\s　]+', (text or '').strip())
              return parts[0] if parts else ''

          def corner_of(text):
              base = base_of(text)
              for e in learned:
                  if e.get('n') == base:
                      return e.get('c')
              for e in learned:
                  if e.get('n') == text:
                      return e.get('c')
              if base in CORNER_OF_NAME:
                  return CORNER_OF_NAME[base]
              for k, kws in CORNER_KEYS:
                  if any(w in (text or '') for w in kws):
                      return k
              return 'other'

          def item_line(item):
              who = mem_map.get(item.get('memberId', ''), '')
              return f"  ・{item.get('text', '')}　{who}".rstrip()

