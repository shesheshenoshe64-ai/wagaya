        run: |
          pip install firebase-admin requests -q
          python3 << 'PYEOF'
          import json, os, re, datetime, requests, firebase_admin
          from firebase_admin import credentials, db

          sa = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          cred = credentials.Certificate(sa)
          firebase_admin.initialize_app(cred, {'databaseURL': os.environ['FIREBASE_DB_URL']})

          jst = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(jst)
          today = now.strftime('%Y-%m-%d')
          tomorrow = (now + datetime.timedelta(days=1)).strftime('%Y-%m-%d')
          WDAYS = ['月', '火', '水', '木', '金', '土', '日']

          def date_label(dstr):
              d = datetime.datetime.strptime(dstr, '%Y-%m-%d')
              return f'{d.month}月{d.day}日（{WDAYS[d.weekday()]}）'

          def short_label(dstr):
              d = datetime.datetime.strptime(dstr, '%Y-%m-%d')
              return f'{d.month}/{d.day}（{WDAYS[d.weekday()]}）'

          root = db.reference('wagaya/v1')
          events = root.child('events').get() or {}
          shopping = root.child('shopping').get() or {}
          members = root.child('members').get() or {}
          shopcats = root.child('shopCats').get() or {}
          corner_map = root.child('cornerMap').get() or []

          def as_list(x):
              if isinstance(x, list):
                  return x
              if isinstance(x, dict):
                  return list(x.values())
              return []

          mem_map = {v['id']: v.get('emoji', '') + v.get('name', '')
                     for v in as_list(members) if isinstance(v, dict) and v.get('id')}
          cat_name = {v['id']: v.get('name', '')
                      for v in as_list(shopcats) if isinstance(v, dict) and v.get('id')}
          SUPER_ID = next((v['id'] for v in as_list(shopcats)
                           if isinstance(v, dict) and v.get('name') == 'スーパー'), None)
          learned = [e for e in as_list(corner_map) if isinstance(e, dict)]

